# frozen_string_literal: true
# Set DATABASE_USERNAME and DATABASE_PASSWORD for your PostgreSQL user.
# On WSL/Linux with peer auth, often: DATABASE_USERNAME=nishant DATABASE_PASSWORD=

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  host: localhost

development:
  <<: *default
  database: ec_admin_development
  username: postgres
  password: postgres

test:
  <<: *default
  database: ec_admin_test
  username: postgres
  password: postgres

production:
  <<: *default
  database: ec_admin_production
  username: ec_admin
  password: <%= ENV["EC_ADMIN_DATABASE_PASSWORD"] %>
